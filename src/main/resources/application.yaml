server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: claim-service
              uri: lb://CLAIM-SERVICE
              predicates:
                - Path=/claims/**
            - id: report-service
              uri: lb://REPORT-SERVICE
              predicates:
                - Path=/reports/**
            - id: matching-service
              uri: lb://MATCHING-SERVICE
              predicates:
                - Path=/matches/**
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}