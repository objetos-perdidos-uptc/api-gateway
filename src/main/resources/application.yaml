server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Server-Side: único punto de entrada público. Los clientes nunca ven IPs ni puertos internos.
          httpclient:
            connect-timeout: 2000
            response-timeout: 10s
          # Failover ante nodos caídos: solo GET (idempotente). Con lb:// el reintento
          # cae en la siguiente instancia del servicio (Round Robin).
          default-filters:
            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
          # lb://NOMBRE-LOGICO = Client-Side Service Discovery contra Eureka. El balanceo es
          # Round Robin (algoritmo por defecto de Spring Cloud LoadBalancer): adecuado mientras
          # las réplicas de cada servicio tengan hardware equivalente.
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
            - id: claim-service
              uri: lb://CLAIM-SERVICE
              predicates:
                - Path=/claims/**
            - id: report-service
              uri: lb://REPORT-SERVICE
              predicates:
                - Path=/reports/**
            - id: matching-service
              # Python sin cliente Eureka: usar DNS interno de Docker
              uri: http://matching-service:8000
              predicates:
                - Path=/matches/**
              filters:
                # Público: /matches/xyz -> /api/v1/matches/xyz (interno)
                - RewritePath=/matches/(?<segment>.*), /api/v1/matches/$\{segment}  

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}

# Rutas que pasan sin token (patrones Ant). Cualquier otra exige un JWT válido.
gateway:
  security:
    public-paths:
      - /auth/register
      - /auth/login

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always